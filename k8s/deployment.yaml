apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
  labels:
    app: employee-api
    app.kubernetes.io/component: employee-api
    app.kubernetes.io/instance: employee-api

spec:
  replicas: 1

  selector:
    matchLabels:
      deployment: employee-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        deployment: employee-api

    spec:
      containers:
      - name: employee-api

        image: image-registry.openshift-image-registry.svc:5000/chapter1/employee-api:latest

        imagePullPolicy: IfNotPresent

        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: employee-api-config
              key: APP_NAME

        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: employee-api-config
              key: APP_VERSION

        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: employee-api-secret
              key: API_KEY

        ports:
        - containerPort: 8080
          protocol: TCP

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
