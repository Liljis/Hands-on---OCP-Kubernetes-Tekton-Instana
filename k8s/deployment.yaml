apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: employee-api

  template:
    metadata:
      labels:
        app: employee-api

    spec:
      containers:
      - name: employee-api
        image: image-registry.openshift-image-registry.svc:5000/chapter1/employee-api:latest
        ports:
        - containerPort: 8080

        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: employee-api-config
              key: APP_NAME

        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: employee-api-config
              key: APP_VERSION

        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: employee-api-secret
              key: API_KEY

        ports:
        - containerPort: 8080
